<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dynamic</title>
</head>
<body>
<div class="center">
    <h2>{{prod_title}}</h2>
    <table border="1">
        <tr class="tab_title">
            <th>Название</th>
            <th>Единица измерения</th>
            <th>Стоимость</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{product[0]}}</td>
            <td>{{product[1]}}</td>
            <td>{{product[2]}}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3">Товары не найдены</td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="{{request.path}}">Назад</a></p>
</div>
</body>
</html>
