<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчёты</title>
</head>
<body>
<div class="center">
    <h2>Отчёт по объёму трафика</h2>

    <form method="get" action="{{ url_for('report.report_list') }}">
        <label for="year">Год</label>
        <input id="year" name="year" type="number" min="1900" max="2100" value="{{ year }}">
        <label for="month">Месяц</label>
        <input id="month" name="month" type="number" min="1" max="12" value="{{ month }}">
        <input type="submit" value="Показать">
        <a href="{{ url_for('report.report_list') }}">Сбросить</a>
    </form>

    <table border="1">
        <tr>
            {% for column in columns %}
            <th>{{ column }}</th>
            {% endfor %}
        </tr>
        {% for row in rows %}
        <tr>
            {% for value in row %}
            <td>{{ '' if value is none else value }}</td>
            {% endfor %}
        </tr>
        {% else %}
        <tr>
            <td colspan="{{ columns|length }}">Данных нет</td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="{{ url_for('main_menu') }}">В главное меню</a></p>
</div>
</body>
</html>
