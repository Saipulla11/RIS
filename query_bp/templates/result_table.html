<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
<div class="center">
    <h2>{{ title }}</h2>
    <table border="1">
        <tr class="tab_title">
            {% for column in columns %}
            <th>{{ column }}</th>
            {% endfor %}
        </tr>
        {% for row in rows %}
        <tr>
            {% for value in row %}
            <td>{{ '' if value is none else value }}</td>
            {% endfor %}
        </tr>
        {% else %}
        <tr>
            <td colspan="{{ columns|length }}">Ничего не найдено</td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="{{ back_url }}">Назад</a></p>
</div>
</body>
</html>
