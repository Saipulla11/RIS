<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главное меню</title>
</head>
<body>
<div class="center">
    <h4>Вы авторизованы как {{ user_group }}</h4>

    <h2>Главное меню</h2>
    <p>
        {% if can_query %}
        <a href="{{ url_for('query.request_handler') }}">Запросы</a>

        {% endif %}
        <a href="{{ url_for('exit_func') }}">Выйти</a>
    </p>
</div>
</body>
</html>
